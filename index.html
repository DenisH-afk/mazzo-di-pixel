<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mazzo di Pixel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
/* Layout: full-screen night sky; dedication at the top, the spinning ASCII bouquet below it, a one-line hint at the bottom. */
:root {
  --sky: #0b0c3a;
  --rose: #ff9fd2;
  --rose-glow: rgba(255, 110, 190, .65);
  --lilac: #d9d3ff;
  --hint: #c9c3ff;
  --hint-glow: rgba(150, 130, 255, .55);
  --font-pixel: "VT323", "Courier New", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--sky);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#scene { touch-action: none; cursor: pointer; outline: none; }
#scene:focus-visible { box-shadow: inset 0 0 0 3px var(--hint); }
#glow { pointer-events: none; filter: blur(7px) saturate(1.35); opacity: .8; mix-blend-mode: screen; }
#scan {
  position: fixed; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,.13) 0 1px, transparent 1px 3px);
}
#dedica {
  position: fixed; left: 0; right: 0; top: 0; pointer-events: none; text-align: center;
  padding: calc(env(safe-area-inset-top, 0px) + clamp(14px, 3.5vh, 40px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  font-family: var(--font-pixel);
  animation: arrive 1.6s ease-out both;
}
#dedica h1 {
  margin: 0; font-weight: 400; line-height: .9;
  font-size: clamp(46px, 8vh, 84px); letter-spacing: .08em;
  color: var(--rose);
  text-shadow: 0 0 6px var(--rose-glow), 0 0 22px var(--rose-glow), 3px 3px 0 rgba(90, 20, 90, .7);
  animation: beat 2.8s ease-in-out infinite;
}
#dedica h1 span { display: inline-block; font-size: .7em; vertical-align: .12em; }
#dedica p {
  margin: .5em auto 0; max-width: 32ch; text-wrap: balance;
  font-size: clamp(19px, 2.7vh, 27px); line-height: 1.15; letter-spacing: .04em;
  color: var(--lilac); text-shadow: 0 0 8px var(--hint-glow);
}
#hint {
  position: fixed; left: 0; right: 0; bottom: 0; margin: 0;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px));
  text-align: center; pointer-events: none;
  font: 21px/1 var(--font-pixel); letter-spacing: .14em;
  color: var(--hint); text-shadow: 0 0 8px var(--hint-glow);
  animation: pulse 2.4s ease-in-out infinite; transition: opacity .8s;
}
#hint.used { opacity: .35; animation: none; }
@keyframes pulse { 50% { opacity: .45; } }
@keyframes beat { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.04); } 24% { transform: scale(1); } 36% { transform: scale(1.03); } }
@keyframes arrive { from { opacity: .2; transform: translateY(-8px); } }
@media (prefers-reduced-motion: reduce) { #hint, #dedica, #dedica h1 { animation: none; } }
</style>

<canvas id="scene" tabindex="0" role="img" aria-label="Mazzo di fiori in pixel per Tara: rose, ibischi, gigli, tulipani e margherite che girano su se stessi. Tocca un fiore per cambiarne il colore, tocca il resto per cambiarli tutti."></canvas>
<canvas id="glow" aria-hidden="true"></canvas>
<div id="scan" aria-hidden="true"></div>
<header id="dedica">
  <h1>Per Tara <span>&#9829;&#xFE0E;</span></h1>
  <p>Questi fiori cambiano colore ogni volta che li tocchi. Quello che provo per te, invece, non cambia mai.</p>
</header>
<p id="hint">tocca o trascina sui fiori</p>

<script>
(() => {
const scene = document.getElementById('scene'), glow = document.getElementById('glow');
const hint = document.getElementById('hint');
const mctx = scene.getContext('2d'), gctx = glow.getContext('2d');
const off = document.createElement('canvas'), octx = off.getContext('2d');
const bgc = document.createElement('canvas'), bctx = bgc.getContext('2d');
const atlas = document.createElement('canvas'), actx = atlas.getContext('2d', { willReadFrequently: true });
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = '"Courier New", ui-monospace, Menlo, Consolas, monospace';
const TAU = Math.PI * 2;
const HEART = '♥︎';

// ---------- palettes [hue, sat, light] ----------
const FLOWER_COLORS = [
  [350, 82, 58], [330, 85, 68], [305, 70, 64], [278, 72, 66], [255, 70, 74], [215, 85, 70],
  [190, 80, 64], [48, 95, 60], [30, 95, 60], [12, 88, 66], [40, 30, 93], [20, 85, 80],
];
const PAPER_COLORS = [[38, 45, 72], [28, 42, 54], [340, 55, 80], [268, 40, 78], [235, 18, 30], [45, 22, 90]];
const RIBBON_COLORS = [[350, 85, 60], [330, 90, 72], [45, 85, 58], [0, 0, 92], [210, 80, 62], [150, 55, 50]];

const NONE = -1, GREEN = -2, PAPER = -3, RIBBON = -4;
const hsl = (h, s, l) => `hsl(${h | 0},${s | 0}%,${l | 0}%)`;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hash = (x, y) => { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function dirChar(a) {
  a = ((a % Math.PI) + Math.PI) % Math.PI;
  if (a < Math.PI / 8 || a >= 7 * Math.PI / 8) return '-';
  if (a < 3 * Math.PI / 8) return '\\';
  if (a < 5 * Math.PI / 8) return '|';
  return '/';
}
function segDist(px, py, ax, ay, bx, by) {
  const vx = bx - ax, vy = by - ay;
  const t = clamp(((px - ax) * vx + (py - ay) * vy) / (vx * vx + vy * vy), 0, 1);
  return Math.hypot(px - ax - vx * t, py - ay - vy * t);
}

// ---------- colour state with ripple transitions ----------
const SPEED = 0.11, WIDTH = 7; // world units per ms, ripple softness
function makeEl(c) { const v = { h: c[0], s: c[1], l: c[2] }; return { from: v, to: v, t0: 0, ox: 0, oy: 0 }; }
function mix(a, b, p) {
  const dh = ((b.h - a.h + 540) % 360) - 180;
  return { h: (a.h + dh * p + 360) % 360, s: a.s + (b.s - a.s) * p, l: a.l + (b.l - a.l) * p };
}
function colorAt(e, x, y, now) {
  if (!e.t0) return e.to;
  const front = (now - e.t0) * SPEED;
  if (front > 260) { e.t0 = 0; return e.to; }
  const p = clamp((front - Math.hypot(x - e.ox, y - e.oy)) / WIDTH, 0, 1);
  const c = mix(e.from, e.to, p);
  if (p > 0 && p < 1) c.flash = Math.sin(p * Math.PI);
  return c;
}
function setColor(e, c, x, y, now) {
  const cur = colorAt(e, x, y, now);
  e.from = { h: cur.h, s: cur.s, l: cur.l }; e.to = c; e.t0 = now; e.ox = x; e.oy = y;
}
function pickNew(list, cur) {
  let c;
  do { c = list[Math.random() * list.length | 0]; } while (c[0] === cur.h && c[2] === cur.l);
  return { h: c[0], s: c[1], l: c[2] };
}

// ---------- flower and bouquet shapes, world units (x right, y down) ----------
let lw = 0.8;    // half-width of thin strokes, set per layout
let theta = 0;   // current spin angle

const SHAPES = {
  rose(dx, dy, r, s) {
    const d = Math.hypot(dx, dy) / r, a = Math.atan2(dy, dx);
    if (d > 1 + 0.07 * Math.sin(5 * a + s * 7)) return null;
    if (d < 0.14) return ['@', 0.5];
    const sp = (((d * 2.8 - a / TAU + s) % 1) + 1) % 1;
    if (sp < 0.2) return ['%', 0.42 + 0.2 * d];
    return ['@', 0.8 + 0.3 * (1 - d) - (d > 0.86 ? 0.14 : 0)];
  },
  hibiscus(dx, dy, r, s) {
    const d = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
    const sa = s * TAU, ex = Math.cos(sa) * r * 1.02, ey = Math.sin(sa) * r * 1.02;
    if (Math.hypot(dx - ex, dy - ey) < r * 0.15) return ['*', 1, [46, 95, 62]];
    if (d > r * 0.2 && segDist(dx, dy, 0, 0, ex, ey) < lw * 0.8) return [dirChar(sa), 1, [54, 90, 74]];
    const R = r * (0.62 + 0.38 * Math.pow(Math.abs(Math.cos(2.5 * (a - sa) + 0.9)), 0.6));
    if (d > R) return null;
    const n = d / R;
    if (d < r * 0.27) return ['#', 0.3];
    if (n < 0.85 && Math.abs(Math.sin(a * 11 + s * 3)) > 0.94) return [dirChar(a), 0.6];
    return [n > 0.88 ? '%' : '#', 0.72 + 0.32 * n];
  },
  lily(dx, dy, r, s) {
    const d = Math.hypot(dx, dy), a = Math.atan2(dy, dx), rot = s * TAU;
    for (let k = 0; k < 6; k++) {
      const sa = k * TAU / 6 + Math.PI / 6 - rot, L = r * 0.62;
      const ex = Math.cos(sa) * L, ey = Math.sin(sa) * L;
      if (Math.hypot(dx - ex, dy - ey) < lw * 1.1) return ['o', 1, [22, 90, 52]];
      if (d > r * 0.12 && segDist(dx, dy, 0, 0, ex, ey) < lw * 0.4) return [dirChar(sa), 1, [80, 60, 76]];
    }
    const c = Math.abs(Math.cos(3 * (a + rot)));
    if (d > r * (0.2 + 0.8 * Math.pow(c, 1.6))) return null;
    const n = d / r;
    if (n < 0.14) return ['+', 0.95];
    if (n < 0.5 && hash(dx * 3.1 + s, dy * 2.7) < 0.14) return [':', 0.35];
    return [dirChar(a), 0.62 + 0.4 * Math.pow(c, 8) + 0.1 * n];
  },
  daisy(dx, dy, r, s) {
    const n = Math.hypot(dx, dy) / r, a = Math.atan2(dy, dx);
    if (n < 0.2) return ['@', 1, [42, 95, 54]];
    if (n < 0.28) return ['o', 1, [28, 80, 34]];
    const c = Math.abs(Math.cos(7 * (a + s * TAU)));
    if (n > 0.5 + 0.5 * Math.pow(c, 0.3)) return null;
    return [dirChar(a), c < 0.25 ? 0.5 : 0.75 + 0.3 * c];
  },
  tulip(dx, dy, r, s) {
    const tilt = (s - 0.5) * 0.6, ct = Math.cos(tilt), st = Math.sin(tilt);
    const u = (dx * ct + dy * st) / (0.72 * r), v = (-dx * st + dy * ct) / r;
    if (u * u + v * v * (v < 0 ? 0.75 : 1) > 1) return null;
    if (v < -0.95 + 0.42 * Math.abs(Math.sin(u * Math.PI * 1.5))) return null;
    const au = Math.abs(u);
    if (Math.abs(au - 0.36) < 0.08) return ['|', 0.5];
    return [au < 0.36 ? '#' : (u < 0 ? '(' : ')'), 0.7 + 0.3 * (1 - au) + (v < -0.3 ? 0.08 : 0)];
  },
};

// The bouquet is a dome of flowers in 3D around a vertical axis, seen slightly from above.
// A point (rho, beta, y) lands on screen at x = rho*sin(beta+theta), y + TILT*rho*cos(beta+theta).
const TILT = 0.22, RIM = 60, RIM_Y = 6;
const SIZE = { rose: 10, hibiscus: 14, lily: 13, daisy: 9, tulip: 8 };
const RINGS = [
  { rho: 0, y: -40, scale: 1, types: ['lily'] },
  { rho: 21, y: -30, scale: 0.95, types: ['rose', 'hibiscus', 'lily', 'rose', 'daisy', 'hibiscus'] },
  { rho: 39, y: -13, scale: 1, types: ['lily', 'rose', 'tulip', 'hibiscus', 'daisy', 'rose', 'lily', 'tulip', 'hibiscus'] },
  { rho: 50, y: 4, scale: 0.85, types: ['rose', 'daisy', 'hibiscus', 'tulip', 'rose', 'lily', 'daisy', 'rose', 'hibiscus', 'tulip'] },
];
const rand = rng(7);
const flowers = [];
RINGS.forEach((ring, ri) => ring.types.forEach((type, k) => {
  const id = flowers.length;
  flowers.push({ id, type, rho: ring.rho, y: ring.y, beta: k * TAU / ring.types.length + ri * 0.3,
    r: SIZE[type] * ring.scale, s: rand(), el: makeEl(FLOWER_COLORS[(id * 5 + ri) % FLOWER_COLORS.length]) });
}));
const leaves = [];
for (let k = 0; k < 12; k++) leaves.push({ rho: 40, y: -6, beta: k * TAU / 12 + 0.26, len: 16 + rand() * 8, e: 0.35 + rand() * 0.5, w: 3.6 + rand() * 1.4, hj: rand() * 25 | 0 });
for (let k = 0; k < 6; k++) leaves.push({ rho: 20, y: -30, beta: k * TAU / 6 + 0.5, len: 13 + rand() * 4, e: 1.0, w: 3, hj: rand() * 25 | 0 });
const breath = [];
for (let q = 0; q < 80; q++) {
  const rho = 8 + rand() * 46;
  breath.push({ rho, beta: rand() * TAU, y: -42 + (rho / 54) * 40 + (rand() - 0.5) * 8 });
}
const STEMS = [0, 1, 2, 3, 4].map(q => q * TAU / 5);
const paperEl = makeEl(PAPER_COLORS[0]), ribbonEl = makeEl(RIBBON_COLORS[0]);
let paperIdx = 0, ribbonIdx = 0;

function coneR(y) { return y <= 52 ? 60 - (y - RIM_Y) * (51 / 46) : 9 - (y - 52) * 0.06; }
function paperFront(x, y) {
  const ax = Math.abs(x);
  if (ax >= RIM || y > 86 + Math.sin(x * 1.7)) return null;
  const rimF = RIM_Y + TILT * Math.sqrt(RIM * RIM - x * x) + 1.4 * Math.sin(9 * (Math.asin(x / RIM) - theta));
  if (y < rimF) return null;
  const R = coneR(y);
  if (ax > R) return null;
  if (y - rimF < 1.3) return ['=', 1.1];
  const phi = Math.asin(clamp(x / R, -1, 1)), f = Math.sin((phi - theta) * 16);
  const sh = 0.82 + 0.16 * f - (ax / R > 0.88 ? 0.14 : 0) - 0.07 * Math.sin(phi);
  return [f > 0.35 ? '#' : f > -0.35 ? '%' : '=', sh];
}
function paperInner(x, y) {
  if (Math.abs(x) >= RIM) return null;
  const s = Math.sqrt(RIM * RIM - x * x), b = Math.PI - Math.asin(x / RIM) - theta;
  if (y < RIM_Y - TILT * s + 1.4 * Math.sin(9 * b) || y > RIM_Y + TILT * s) return null;
  const f = Math.sin(b * 16);
  return [f > 0 ? '%' : '=', 0.55 + 0.1 * f];
}
function ribbonBand(x, y) {
  const R = coneR(49.5) + 0.4;
  if (Math.abs(x) > R) return null;
  if (Math.abs(y - (49.5 + TILT * Math.sqrt(R * R - x * x) * 0.4)) > 2) return null;
  const b = Math.asin(clamp(x / R, -1, 1)) - theta;
  return [Math.sin(b * 10) > 0 ? '+' : '-', 0.85 - 0.25 * Math.abs(x) / R];
}
function bow(x, y) { // drawn at local origin (0, 50)
  const stripe = (Math.floor((x + 100) * 1.2) + Math.floor((y + 100) * 0.7)) % 2 ? '+' : '-';
  if ((x / 4.5) ** 2 + ((y - 50) / 3.4) ** 2 < 1) return ['#', 0.78];
  for (const sg of [-1, 1]) {
    const a = -0.35 * sg, lx = x - sg * 9.5, ly = y - 46.5;
    const u = (lx * Math.cos(a) + ly * Math.sin(a)) / 8.5, v = (-lx * Math.sin(a) + ly * Math.cos(a)) / 4.6;
    const e = u * u + v * v;
    if (e < 1 && e > 0.28) return [stripe, 0.75 + (v < 0 ? 0.35 * (1 - e) : 0.1)];
    if (segDist(x, y, sg * 2, 52, sg * 9, 67) < 1.3) return [stripe, 0.7];
    if (segDist(x, y, sg * 1, 52, sg * 4, 70) < 1.1) return [stripe, 0.58];
  }
  return null;
}
function leafShape(x, y, L) {
  const dx = x - L.x, dy = y - L.y, ca = Math.cos(L.a), sa = Math.sin(L.a);
  const t = (dx * ca + dy * sa) / L.len, pe = -dx * sa + dy * ca;
  if (t < 0 || t > 1) return null;
  if (Math.abs(pe) > L.w * Math.sin(Math.PI * Math.pow(t, 0.8))) return null;
  if (Math.abs(pe) < lw * 0.5) return [dirChar(L.a), 1, [100, 45, 50]];
  return [dirChar(L.a + (pe > 0 ? 0.6 : -0.6)), 1, [125 + L.hj, 45, pe > 0 ? 27 : 36]];
}
function foliage(x, y) {
  if ((x / 54) ** 2 + ((y + 14) / 34) ** 2 > 1) return null;
  const h = hash(x * 1.3, y * 0.9);
  return [h < 0.25 ? ',' : h < 0.5 ? ';' : h < 0.7 ? '.' : h < 0.85 ? '"' : "'", 1, [135 + h * 20, 45, 14 + h * 12]];
}

// ---------- layout and per-frame cell buffers ----------
const X0 = -72, Y0 = -56, WW = 144, WH = 150;
const CHARS = '@%#=+-|/\\:o*.,;"\'()';
const CHAR_IDX = {}; [...CHARS].forEach((c, q) => { CHAR_IDX[c] = q + 1; });
let W, H, dpr, k, cw, chh, cwD, chhD, cwW, chW, cols, rows, originX, originY, fontPx;
let colX, rowY, chIdx, own, colorImg, glyphs, offImg, offPix;
let stars = [], hearts = [], bursts = [], renderNow = 0;
const introStart = performance.now();

function layout() {
  W = innerWidth; H = innerHeight; dpr = Math.min(2, devicePixelRatio || 1);
  if (!W || !H) return;
  scene.width = W * dpr; scene.height = H * dpr;
  glow.width = Math.round(W * dpr / 2); glow.height = Math.round(H * dpr / 2);
  k = Math.min(W * 1.1 / WW, H * 0.68 / WH); // on a narrow phone the paper rim may be cut a little
  cwD = Math.max(4, Math.round(clamp(k * 1.25, 4.6, 11) * dpr)); cw = cwD / dpr;
  chhD = Math.round(cwD * 1.4); chh = chhD / dpr; fontPx = cw * 1.5;
  cwW = cw / k; chW = chh / k;
  cols = Math.ceil(WW / cwW); rows = Math.ceil(WH / chW);
  originX = W / 2 - (WW / 2) * k;
  originY = Math.min(H * 0.62 - (WH / 2) * k, H - WH * k - 40);
  lw = 0.55 * chW;

  colX = Float32Array.from({ length: cols }, (_, i) => X0 + (i + 0.5) * cwW);
  rowY = Float32Array.from({ length: rows }, (_, j) => Y0 + (j + 0.5) * chW);
  chIdx = new Uint8Array(cols * rows); own = new Int16Array(cols * rows).fill(NONE);
  colorImg = new ImageData(cols, rows);
  off.width = cols * cwD; off.height = rows * chhD;

  // white glyph atlas: one cell per character, tinted later in one pass
  atlas.width = CHARS.length * cwD; atlas.height = chhD;
  actx.clearRect(0, 0, atlas.width, atlas.height);
  actx.font = `bold ${fontPx * dpr}px ${FONT}`; actx.fillStyle = '#fff';
  actx.textAlign = 'center'; actx.textBaseline = 'middle';
  [...CHARS].forEach((c, q) => actx.fillText(c, q * cwD + cwD / 2, chhD / 2));
  const ad = actx.getImageData(0, 0, atlas.width, atlas.height).data;
  glyphs = [...CHARS].map((c, q) => {
    const offs = [], al = [];
    for (let y = 0; y < chhD; y++) for (let x = 0; x < cwD; x++) {
      const a = ad[(y * atlas.width + q * cwD + x) * 4 + 3];
      if (a > 8) { offs.push(y * off.width + x); al.push(a); }
    }
    return { n: offs.length, off: Int32Array.from(offs), a: Uint8Array.from(al) };
  });
  offImg = octx.createImageData(off.width, off.height);
  offPix = new Uint32Array(offImg.data.buffer);

  // sky
  bgc.width = scene.width; bgc.height = scene.height;
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = bctx.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.8);
  g.addColorStop(0, '#3a33b0'); g.addColorStop(0.35, '#23248a'); g.addColorStop(0.75, '#12145a'); g.addColorStop(1, '#070828');
  bctx.fillStyle = g; bctx.fillRect(0, 0, W, H);

  const r2 = rng(11);
  stars = Array.from({ length: Math.round(W * H / 5500) }, () => ({
    x: Math.round(r2() * W / cw) * cw, y: Math.round(r2() * H / chh) * chh,
    ch: '+..:*'[r2() * 5 | 0], ph: r2() * TAU, sp: 0.6 + r2() * 2,
  }));
  hearts = Array.from({ length: Math.round(Math.max(14, W * H / 40000)) }, () => newHeart(r2, true));
}
function newHeart(r, anywhere) {
  return { x: r() * W, y: anywhere ? r() * H : H + 20, vy: 6 + r() * 12, ph: r() * TAU, size: cw * (1.5 + r() * 1.2), hue: 330 + r() * 25 };
}

// ---------- painting the cell buffers (painter's order, back to front) ----------
function put(idx, r, owner, el, x, y, dim) {
  const ci = CHAR_IDX[r[0]];
  if (!ci) return;
  let h, s, l;
  if (r[2]) { h = r[2][0]; s = r[2][1]; l = r[2][2] * dim; }
  else {
    const c = colorAt(el, x, y, renderNow);
    h = c.h; s = c.s; l = clamp(c.l * r[1] * dim + 28 * (c.flash || 0), 6, 97);
  }
  s /= 100; l /= 100;
  const a = s * Math.min(l, 1 - l), d = colorImg.data, o = idx * 4;
  for (let q = 0; q < 3; q++) {
    const kk = ([0, 8, 4][q] + h / 30) % 12;
    d[o + q] = 255 * (l - a * Math.max(-1, Math.min(kk - 3, 9 - kk, 1)));
  }
  d[o + 3] = 255;
  chIdx[idx] = ci; own[idx] = owner;
}
function paint(x0, y0, x1, y1, fn, owner, el, dim) {
  const i0 = Math.max(0, Math.floor((x0 - X0) / cwW)), i1 = Math.min(cols - 1, Math.floor((x1 - X0) / cwW));
  const j0 = Math.max(0, Math.floor((y0 - Y0) / chW)), j1 = Math.min(rows - 1, Math.floor((y1 - Y0) / chW));
  for (let j = j0; j <= j1; j++) {
    const y = rowY[j];
    for (let i = i0; i <= i1; i++) {
      const x = colX[i], r = fn(x, y);
      if (r) put(j * cols + i, r, owner, el, x, y, dim);
    }
  }
}
const depthDim = z => 0.6 + 0.4 * clamp((z / 55 + 1) / 2, 0, 1);

function renderBouquet(now) {
  renderNow = now;
  chIdx.fill(0); own.fill(NONE);
  paint(-RIM, RIM_Y - TILT * RIM - 2, RIM, RIM_Y + TILT * RIM, paperInner, PAPER, paperEl, 1);
  paint(-54, -48, 54, 20, foliage, GREEN, null, 1);
  for (const b of breath) {
    const a = b.beta + theta, bx = b.rho * Math.sin(a), bz = b.rho * Math.cos(a), by = b.y + TILT * bz;
    const dim = depthDim(bz);
    paint(bx - 1.6, by - 1.6, bx + 1.6, by + 1.6, (x, y) => {
      const d = Math.hypot(x - bx, y - by);
      return d < 0.9 ? ['*', 1, [0, 0, 96]] : d < 1.6 ? ['.', 1, [240, 30, 80]] : null;
    }, GREEN, null, dim);
  }

  // flowers and leaves sorted by depth
  const sprites = [];
  for (const f of flowers) {
    const a = f.beta + theta, z = f.rho * Math.cos(a);
    sprites.push({ z, f, x: f.rho * Math.sin(a), y: f.y + TILT * z,
      sx: f.type === 'tulip' || f.rho === 0 ? 1 : 0.5 + 0.5 * Math.abs(Math.cos(a)) });
  }
  for (const L of leaves) {
    const a = L.beta + theta, ca = Math.cos(a), sa = Math.sin(a), rt = L.rho + L.len * Math.cos(L.e);
    const bx = L.rho * sa, by = L.y + TILT * L.rho * ca, tx = rt * sa, ty = L.y - L.len * Math.sin(L.e) + TILT * rt * ca;
    const len = Math.hypot(tx - bx, ty - by);
    if (len > 2) sprites.push({ z: (L.rho + rt) / 2 * ca, leaf: { x: bx, y: by, len, w: L.w, a: Math.atan2(ty - by, tx - bx), hj: L.hj }, x0: Math.min(bx, tx), x1: Math.max(bx, tx), y0: Math.min(by, ty), y1: Math.max(by, ty) });
  }
  sprites.sort((p, q) => p.z - q.z);
  for (const sp of sprites) {
    const dim = depthDim(sp.z);
    if (sp.leaf) {
      const L = sp.leaf, m = L.w + 1;
      paint(sp.x0 - m, sp.y0 - m, sp.x1 + m, sp.y1 + m, (x, y) => leafShape(x, y, L), GREEN, null, dim);
    } else {
      const f = sp.f, R = f.r * 1.3, fx = sp.x, fy = sp.y, sx = sp.sx, shape = SHAPES[f.type];
      paint(fx - R, fy - R, fx + R, fy + R, (x, y) => shape((x - fx) / sx, y - fy, f.r, f.s), f.id, f.el, dim);
    }
  }

  paint(-RIM, RIM_Y - 2, RIM, 88, paperFront, PAPER, paperEl, 1);
  paint(-8, 84, 8, 92, (x, y) => {
    for (const b of STEMS) if (Math.abs(x - 3.5 * Math.sin(b + theta) * (1 + (y - 84) * 0.12)) < lw) return ['|', 1, [110, 45, 40]];
    return null;
  }, GREEN, null, 1);
  paint(-11, 46, 11, 54, ribbonBand, RIBBON, ribbonEl, 1);
  const ba = theta, bc = Math.cos(ba);
  if (bc > 0.05) { // the bow is on the front of the neck, hidden when it turns away
    const bx = 9.5 * Math.sin(ba), by = TILT * 9.5 * bc, sx = 0.35 + 0.65 * bc;
    paint(bx - 20 * sx, 40 + by, bx + 20 * sx, 72 + by, (x, y) => bow((x - bx) / sx, y - by), RIBBON, ribbonEl, 1);
  }

  // stamp each glyph's pixels straight into one image, coloured: no per-cell canvas calls
  const cd = colorImg.data, offW = off.width;
  offPix.fill(0);
  for (let j = 0, idx = 0; j < rows; j++) for (let i = 0; i < cols; i++, idx++) {
    const c = chIdx[idx];
    if (!c) continue;
    const g = glyphs[c - 1], base = j * chhD * offW + i * cwD, o = idx * 4;
    const rgb = (cd[o + 2] << 16) | (cd[o + 1] << 8) | cd[o];
    for (let p = 0; p < g.n; p++) offPix[base + g.off[p]] = (g.a[p] << 24 >>> 0) | rgb;
  }
  octx.putImageData(offImg, 0, 0);
}

// ---------- drawing the frame ----------
function sway(j, t) {
  if (reduce) return 0;
  const y = Y0 + (j + 0.5) * chW, w = clamp((84 - y) / 140, 0, 1);
  return cw * (0.8 * Math.sin(t * 1.3 + j * 0.045) * w * w + 0.4 * Math.sin(t * 2.1 + j * 0.11) * w * w * w);
}
function drawBouquet(ctx, t, now) {
  const p = reduce ? 1 : Math.min(1, (now - introStart) / 1800);
  const jMin = Math.floor(rows * Math.pow(1 - p, 3));
  for (let j = jMin; j < rows; j++) {
    ctx.drawImage(off, 0, j * chhD, off.width, chhD, originX + sway(j, t), originY + j * chh, cols * cw, chh);
  }
}
function drawHearts(ctx, t) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const h of hearts) {
    ctx.font = `${h.size}px ${FONT}`;
    ctx.fillStyle = hsl(h.hue, 90, 72);
    ctx.globalAlpha = 0.55 + 0.35 * Math.sin(t * 1.7 + h.ph);
    ctx.fillText(HEART, h.x + Math.sin(t * 0.8 + h.ph) * 6, h.y);
  }
  for (const b of bursts) {
    ctx.font = `bold ${b.size}px ${FONT}`;
    ctx.fillStyle = b.color; ctx.globalAlpha = clamp(b.life, 0, 1);
    ctx.fillText(b.ch, b.x, b.y);
  }
  ctx.globalAlpha = 1;
}
function drawStars(t) {
  mctx.font = `bold ${fontPx}px ${FONT}`;
  mctx.textAlign = 'center'; mctx.textBaseline = 'middle';
  mctx.fillStyle = 'hsl(230,80%,88%)';
  for (const s of stars) {
    mctx.globalAlpha = reduce ? 0.6 : 0.25 + 0.75 * Math.abs(Math.sin(t * s.sp + s.ph));
    mctx.fillText(s.ch, s.x, s.y);
  }
  mctx.globalAlpha = 1;
}

const SPIN = TAU / 7; // one full turn every 7 s, always: never slowed or stopped (the spin is the point of the page)
let last = performance.now(), pressed = false;
function frame(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (innerWidth !== W || innerHeight !== H) layout(); // also covers a page that loaded while hidden (0x0)
  if (!W || !H) { requestAnimationFrame(frame); return; }
  theta += SPIN * dt;
  renderBouquet(now);

  if (!reduce) for (const h of hearts) { h.y -= h.vy * dt; if (h.y < -20) Object.assign(h, newHeart(Math.random, false)); }
  for (const b of bursts) { b.x += b.vx * dt; b.y += b.vy * dt; b.vy -= 40 * dt; b.vx *= 0.98; b.life -= dt * 0.8; }
  bursts = bursts.filter(b => b.life > 0);

  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.drawImage(bgc, 0, 0);
  mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawStars(t);
  drawHearts(mctx, t);
  drawBouquet(mctx, t, now);

  gctx.setTransform(dpr / 2, 0, 0, dpr / 2, 0, 0);
  gctx.clearRect(0, 0, W, H);
  drawBouquet(gctx, t, now);
  drawHearts(gctx, t);
  requestAnimationFrame(frame);
}

// ---------- interaction ----------
function hitTest(px, py) {
  const j = Math.floor((py - originY) / chh);
  const o = j >= 0 && j < rows ? sway(j, performance.now() / 1000) : 0;
  const i = Math.floor((px - originX - o) / cw);
  const x = X0 + (px - originX - o) / k, y = Y0 + (py - originY) / k;
  const owner = i >= 0 && i < cols && j >= 0 && j < rows ? own[j * cols + i] : NONE;
  return { owner, x, y };
}
function burst(px, py, n, color) {
  for (let q = 0; q < n; q++) {
    const a = Math.random() * TAU, v = 50 + Math.random() * 140;
    bursts.push({ x: px, y: py, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: 1 + Math.random() * 0.4,
      size: cw * (1.4 + Math.random() * 1.4), color, ch: Math.random() < 0.6 ? HEART : '*' });
  }
}
function waveAll(x, y, px, py, now) {
  for (const f of flowers) setColor(f.el, pickNew(FLOWER_COLORS, f.el.to), x, y, now);
  burst(px, py, 22, 'hsl(335,95%,75%)');
}
let lastOwner = null;
function interact(px, py, isTap) {
  const now = performance.now(), { owner, x, y } = hitTest(px, py);
  if (!isTap && (owner < 0 || owner === lastOwner)) return;
  lastOwner = owner;
  hint.classList.add('used');
  try { navigator.vibrate && navigator.vibrate(10); } catch (e) {}
  if (owner >= 0) {
    const e = flowers[owner].el, c = pickNew(FLOWER_COLORS, e.to);
    setColor(e, c, x, y, now);
    burst(px, py, 9, hsl(c.h, c.s, Math.max(60, c.l)));
  } else if (owner === PAPER) {
    paperIdx = (paperIdx + 1) % PAPER_COLORS.length;
    const c = PAPER_COLORS[paperIdx]; setColor(paperEl, { h: c[0], s: c[1], l: c[2] }, x, y, now);
  } else if (owner === RIBBON) {
    ribbonIdx = (ribbonIdx + 1) % RIBBON_COLORS.length;
    const c = RIBBON_COLORS[ribbonIdx]; setColor(ribbonEl, { h: c[0], s: c[1], l: c[2] }, x, y, now);
    burst(px, py, 9, hsl(c[0], c[1], c[2]));
  } else {
    waveAll(x, y, px, py, now);
  }
}
scene.addEventListener('pointerdown', e => {
  pressed = true;
  try { scene.setPointerCapture(e.pointerId); } catch (err) {}
  interact(e.clientX, e.clientY, true);
});
scene.addEventListener('pointermove', e => { if (pressed) interact(e.clientX, e.clientY, false); });
const release = () => { pressed = false; lastOwner = null; };
scene.addEventListener('pointerup', release);
scene.addEventListener('pointercancel', release);
scene.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  e.preventDefault();
  waveAll(0, -12, W / 2, originY + (-12 - Y0) * k, performance.now());
});

layout();
requestAnimationFrame(frame);
})();
</script>

</html>
